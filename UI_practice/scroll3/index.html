<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ページスクロール:文字と画像操作</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

  <header>
    <h1>ページスクロール:文字と画像操作</h1>
  </header>

  <div class="section" id="section1">
    <div class="content">
      <div class="text">
        <div class="text-layer original">
          <h2>セクション 1</h2>
          <p>これはセクション1の内容です。</p>
        </div>
        <div class="text-layer hover-text">
          <h2>セクション 1</h2>
          <p>カーソルが来た時のテキスト。</p>
        </div>
      </div>
      <img src="https://placehold.jp/350x250.png" alt="placeholder">
    </div>
  </div>

  <div class="section" id="section2">
    <div class="content">
      <div class="text">
        <div class="text-layer original">
          <h2>セクション 2</h2>
          <p>これはセクション2の内容です。</p>
        </div>
        <div class="text-layer hover-text">
          <h2>セクション 2</h2>
          <p>こちらはホバー時のテキストです。</p>
        </div>
      </div>
      <img src="https://placehold.jp/350x250.png" alt="placeholder">
    </div>
  </div>

  <div class="section" id="section3">
    <div class="content">
      <div class="text">
        <div class="text-layer original">
          <h2>セクション 3</h2>
          <p>通常時のセクション3テキストです。</p>
        </div>
        <div class="text-layer hover-text">
          <h2>セクション 3</h2>
          <p>マウスが来た時の切り替えテキスト。</p>
        </div>
      </div>
      <img src="https://placehold.jp/350x250.png" alt="placeholder">
    </div>
  </div>

  <div class="section" id="section4">
    <div class="content">
      <div class="text">
        <div class="text-layer original">
          <h2>セクション 4</h2>
          <p>通常表示の説明です。</p>
        </div>
        <div class="text-layer hover-text">
          <h2>セクション 4</h2>
          <p>こちらがホバー時の内容です。</p>
        </div>
      </div>
      <img src="https://placehold.jp/350x250.png" alt="placeholder">
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
